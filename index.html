<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --bg: #4B2E83;
    --ink: #FFFFFF;
    --ink-soft: #E4D4F5;
    --card-bg: #FFFFFF;
    --card-text: #2A1B4D;
    --card-text-soft: #6b5b8c;
    --accent: #F45B9E;
    --shadow: rgba(42, 27, 77, 0.35);
    --track: rgba(255, 255, 255, 0.14);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #2A1B4D;
      --ink: #F3E8FA;
      --ink-soft: #C9B3E0;
      --shadow: rgba(0, 0, 0, 0.5);
      --track: rgba(255, 255, 255, 0.08);
    }
  }

  :root[data-theme="dark"] {
    --bg: #2A1B4D;
    --ink: #F3E8FA;
    --ink-soft: #C9B3E0;
    --shadow: rgba(0, 0, 0, 0.5);
    --track: rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }

  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 88% 6%, var(--accent) 0%, rgba(244,91,158,0.0) 32%),
      radial-gradient(circle at -10% 90%, rgba(244,91,158,0.25), transparent 35%);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 20px 64px;
  }

  .page { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; text-align: center; }

  .avatar {
    width: 78px; height: 78px; border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Baloo 2', cursive, sans-serif;
    font-size: 26px; font-weight: 700; color: #FFFFFF;
    margin-bottom: 20px; overflow: hidden;
  }

  h1 { font-family: 'Baloo 2', cursive, sans-serif; font-weight: 800; font-size: clamp(34px, 9vw, 46px); margin: 0; color: var(--ink); }
  .tagline { margin: 10px 0 34px; font-size: 15.5px; line-height: 1.5; color: var(--ink-soft); max-width: 320px; }
  .links { width: 100%; display: flex; flex-direction: column; gap: 12px; }

  .link-card {
    display: flex; align-items: center; gap: 14px; width: 100%;
    padding: 15px 18px; background: var(--card-bg); color: var(--card-text);
    border: none; border-radius: 16px; text-decoration: none;
    font-weight: 700; font-size: 16px; box-shadow: 0 6px 18px var(--shadow);
  }

  .icon-dot { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; }
  .icon-dot svg { width: 17px; height: 17px; color: #FFFFFF; }
  .link-text { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
  .link-text .sub { font-size: 12px; font-weight: 500; color: var(--card-text-soft); }

  .otaku-section { width: 100%; margin-top: 40px; text-align: left; }
  .otaku-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .otaku-title { font-family: 'Baloo 2', cursive, sans-serif; font-weight: 700; font-size: 19px; color: var(--ink); }
  .otaku-badge { background: var(--accent); color: #FFFFFF; font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 20px; white-space: nowrap; }

  .day-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; }
  .day-scroll::-webkit-scrollbar { height: 5px; }
  .day-scroll::-webkit-scrollbar-thumb { background: var(--track); border-radius: 4px; }

  .day-card { flex: 0 0 auto; scroll-snap-align: start; width: 116px; background: var(--card-bg); border-radius: 14px; padding: 12px 12px; text-decoration: none; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 4px 12px var(--shadow); }
  .day-card .day-num { font-family: 'Baloo 2', cursive, sans-serif; font-weight: 700; font-size: 14px; color: var(--accent); }
  .day-card .day-title { font-size: 12px; line-height: 1.35; color: var(--card-text); font-weight: 500; }

  .scroll-hint { margin-top: 8px; font-size: 12px; color: var(--ink-soft); }

  .owner-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .edit-btn { background: transparent; border: 1.5px dashed var(--ink-soft); color: var(--ink-soft); font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12.5px; font-weight: 600; padding: 8px 14px; border-radius: 20px; cursor: pointer; }
  .edit-btn:hover { opacity: 0.8; }

  .footer-chip { margin-top: 36px; padding: 7px 16px; border: 1.5px dashed var(--ink-soft); border-radius: 20px; font-size: 12.5px; color: var(--ink-soft); }
</style>
</head>

  function renderAvatar(state){
    var el = document.getElementById('avatar');
    if (state.avatarUrl) {
      el.innerHTML = '';
      var img = document.createElement('img');
      img.src = state.avatarUrl;
      img.alt = 'Sakuga Talks avatar';
      img.style.width = '100%';
      img.style.height = '100%';
      img.style.borderRadius = '50%';
      img.style.objectFit = 'cover';
      el.appendChild(img);
    } else {
      el.textContent = 'ST';
    }
  }

  function renderDays(state){
    var scrollEl = document.getElementById('day-scroll');
    scrollEl.innerHTML = '';
    state.days.forEach(function(d){
      var a = document.createElement('a');
      a.className = 'day-card';
      a.href = d.url || '#';
      a.target = '_blank';
      a.rel = 'noopener';
      var num = document.createElement('span');
      num.className = 'day-num';
      num.textContent = 'Day ' + d.day;
      var title = document.createElement('span');
      title.className = 'day-title';
      title.textContent = d.title;
      a.appendChild(num);
      a.appendChild(title);
      scrollEl.appendChild(a);
    });
    var last = state.days[state.days.length - 1];
    document.getElementById('otaku-badge').textContent = 'Day ' + (last ? last.day : 1) + ' of 100';
  }

  function buildFullHtml(state){
    return HEAD + JSON.stringify(state) + '\n<\/script>\n  <script>(' + appLogic.toString() + ')();<\/script>\n</body>\n</html>';
  }

  function publish(newState, artifactCap, state){
    renderAvatar(newState);
    renderDays(newState);
    var html = buildFullHtml(newState);
    artifactCap.publish(html).catch(function(){
      window.alert('Could not save changes. Please try again.');
      renderAvatar(state);
      renderDays(state);
    });
  }

  function renderOwnerTools(state, artifactCap){
    var container = document.getElementById('edit-controls');
    container.innerHTML = '';

    var addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'edit-btn';
    addBtn.textContent = '+ Add a day';
    addBtn.onclick = function(){

      var url = window.prompt('Link for this day (YouTube/Instagram URL):', 'https://');
      if (!url) return;

      if (url === null) return;
      var trimmed = url.trim();
      var newState = Object.assign({}, state, { avatarUrl: trimmed ? trimmed : null });
      publish(newState, artifactCap, state);
    };
    container.appendChild(avatarBtn);
  }

  var state = JSON.parse(document.getElementById('page-data').textContent);
  renderAvatar(state);
  renderDays(state);

  if (typeof claude !== 'undefined' && claude && claude.use) {
    Promise.all([
      claude.use('user').catch(function(){ return null; }),
      claude.use('artifact').catch(function(){ return null; })
    ]).then(function(res){
      var user = res[0];
      var artifactCap = res[1];
      var canEdit = !!(user && user.canEdit && user.canEdit());
      if (canEdit && artifactCap) {
        renderOwnerTools(state, artifactCap);
      }
    });
  }
})();</script>
